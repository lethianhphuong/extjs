<!DOCTYPE HTML>
<html lang="vn" manifest="">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=10, user-scalable=yes">

    <script type="text/javascript" src="lib/flatpickr/flatpickr.js"></script>
    <script type="text/javascript" src="lib/flatpickr/flatpickr.min.js"></script>
    <script type="text/javascript" src="lib/flatpickr/vn.js"></script>

    <script type="text/javascript" src="lib/pdf-lib/pdf-lib.js"></script>

    <script type="text/javascript" src="lib/base64.js"></script>
    <script type="text/javascript" src="lib/vgcaplugin.js"></script>

    <script type="text/javascript" src="lib/axios/axios.js"></script>

    <script src="lib/leaflet/leaflet.js"></script>
    <link rel="stylesheet" href="lib/leaflet/leaflet.css">

    <script src="lib/leaflet/leaflet-mapbox-gl.js"></script>
    <script src="lib/maplibre-gl.js"></script>

    <script type="text/javascript">
        //#region GetVersion
        const now = new Date();
        let version = now.getFullYear().toString();
        version += String(now.getMonth() + 1).padStart(2, '0');
        version += String(now.getDate()).padStart(2, '0');
        version += String(now.getHours()).padStart(2, '0');
        //#endregion

        var script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'lib/gendong/gendong.js' + '?v=' + version;
        document.head.appendChild(script);
    </script>

    <title></title>
    <link rel="icon" href="resources/image/logo.png">
    <link rel="stylesheet" href="resources/css/app.css">
    <link rel="stylesheet" href="lib/flatpickr/flatpickr.min.css">
    <link rel="stylesheet" href="lib/flatpickr/flatpickr.css">

    <script type="text/javascript">
        var Ext = Ext || {}; // Ext namespace won't be defined yet...

        // This function is called by the Microloader after it has performed basic
        // device detection. The results are provided in the "tags" object. You can
        // use these tags here or even add custom tags. These can be used by platform
        // filters in your manifest or by platformConfig expressions in your app.
        //
        Ext.beforeLoad = function (tags) {
            let profile = 'classic';
            Ext.manifest = profile; // this name must match a build profile name
        };
    </script>

    <!-- The line below must be kept intact for Sencha Cmd to build your application -->
    <script id="microloader" data-app="b7d8d10f-ce6a-494e-b452-2b6c0b6b49b5" type="text/javascript"
        src="bootstrap.js"></script>
    <style>
        #preview-img {
            z-index: -1;
            position: absolute;
            width: 600px;
            height: 400px;
            visibility: hidden;
            background-repeat: no-repeat;
            background-size: contain;
        }

        @-webkit-keyframes fade {

            0%,
            100% {
                opacity: 1;
            }

            60% {
                opacity: 0;
            }
        }

        @keyframes fade {

            0%,
            100% {
                opacity: 1;
            }

            60% {
                opacity: 0;
            }
        }

        .loading-app {
            content: 'Vui lòng đợi...';
            position: absolute;
            padding: 0 0px 8px 0;
            font-size: 20px;
            background: repeating-linear-gradient(90deg, green, green) 200% 100%/200% 3px no-repeat;
            animation: c3 10s linear infinite;
            font-style: italic;
            top: 50%;
            margin-top: -16px;
            width: 98%;
            left: 1%;
        }

        .loading-app::before {
            content: 'Vui lòng đợi...';
        }

        @keyframes c3 {
            to {
                background-position: 80% 100%;
            }
        }


        #loading-custom {
            z-index: 999999999999;
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            right: 0;
            background-color: rgba(165, 165, 165, 0.3);
            visibility: hidden;
        }

        #loading-custom[class^=showLoading] {
            visibility: visible;
        }

        @keyframes rounder-1 {
            from {
                opacity: 0;
                transform: scale(1.1);
            }

            to {
                opacity: 0.7;
                transform: scale(1.4);
            }
        }

        @keyframes rounder-2 {
            from {
                opacity: 0;
                transform: scale(1.1);
            }

            to {
                opacity: 0.5;
                transform: scale(1.7);
            }
        }

        @keyframes rounder_3 {
            from {
                opacity: 0;
                transform: scale(1.1);
            }

            to {
                opacity: 0.3;
                transform: scale(2);
            }

        }
    </style>
</head>

<body>
    <div class="loading-app"></div>
    <div id="loading-custom">
        <div class="loading-center">
            <div class="loading-content">
                <div class="loading-image">
                    <img alt="loading-app" src="resources/image/logo.png" width="100%" height="100%" />
                </div>
                <span class="boder-animation ba-1"></span>
                <span class="boder-animation ba-2"></span>
                <span class="boder-animation ba-3"></span>
            </div>
        </div>
    </div>
    <div id="preview-img">

    </div>
</body>

</html>
